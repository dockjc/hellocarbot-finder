<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="헬로카봇 로봇 이름(초성 가능)으로 나오는 시즌과 회차를 찾아요.">
<meta name="theme-color" content="#13296A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카봇 찾기">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>.wrap{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(40px,calc(24px + env(safe-area-inset-bottom)))}</style>
<title>헬로카봇 출연편 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #EDF1F6;
  --surface: #FFFFFF;
  --surface-2: #F4F6FA;
  --ink: #141A23;
  --ink-2: #445063;
  --ink-3: #6F7B8F;
  --line: #D9E0E9;
  --red: #D7262F;
  --red-soft: #FDE7E8;
  --navy: #1C3A8C;
  --navy-deep: #13296A;
  --navy-soft: #E4EAF9;
  --link: #1C3A8C;
  --yellow: #FFC619;
  --yellow-soft: #FFF3CC;
  --yellow-ink: #6B4E00;
  --plate: #FFFFFF;
  --plate-ink: #12151B;
  --plate-edge: #2A303B;
  --shadow: 0 1px 2px rgba(20, 26, 35, .06), 0 8px 22px rgba(20, 26, 35, .07);
  --display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --sign: 'Do Hyeon', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1319;
    --surface: #1A1F28;
    --surface-2: #212733;
    --ink: #EDF1F7;
    --ink-2: #B4BECD;
    --ink-3: #8994A7;
    --line: #2D3543;
    --red: #FF5A61;
    --red-soft: #3A1D22;
    --navy: #3F63C9;
    --navy-deep: #182E6E;
    --navy-soft: #1E2A47;
    --link: #93AEFF;
    --yellow: #FFD04A;
    --yellow-soft: #3A3117;
    --yellow-ink: #FFDD7A;
    --plate: #F3F5F9;
    --plate-ink: #12151B;
    --plate-edge: #0B0E13;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .28);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1319;
  --surface: #1A1F28;
  --surface-2: #212733;
  --ink: #EDF1F7;
  --ink-2: #B4BECD;
  --ink-3: #8994A7;
  --line: #2D3543;
  --red: #FF5A61;
  --red-soft: #3A1D22;
  --navy: #3F63C9;
  --navy-deep: #182E6E;
  --navy-soft: #1E2A47;
  --link: #93AEFF;
  --yellow: #FFD04A;
  --yellow-soft: #3A3117;
  --yellow-ink: #FFDD7A;
  --plate: #F3F5F9;
  --plate-ink: #12151B;
  --plate-edge: #0B0E13;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--body);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- hero: the toy box ---------- */
.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 42%);
  gap: 8px;
  background: var(--navy-deep);
  color: #fff;
  border-radius: 26px;
  padding: 22px 18px 58px 22px;
  overflow: hidden;
  isolation: isolate;
}
.hero::before { /* headlight glow */
  content: "";
  position: absolute; inset: -40% -20% auto auto;
  width: 70%; aspect-ratio: 1;
  background: radial-gradient(circle, rgba(255, 198, 25, .22), transparent 62%);
  z-index: -1;
}
.hero::after { /* lane markings */
  content: "";
  position: absolute; left: 0; right: 0; bottom: 18px; height: 5px;
  background: repeating-linear-gradient(90deg, var(--yellow) 0 26px, transparent 26px 44px);
  opacity: .9;
}
.eyebrow {
  display: inline-block;
  font: 500 12px/1 var(--body);
  letter-spacing: .08em;
  color: #FFE08A;
  margin: 2px 0 10px;
}
.hero h1 {
  margin: 0;
  font: 400 clamp(29px, 7.6vw, 46px)/1.12 var(--display);
  letter-spacing: -.01em;
  text-wrap: balance;
}
.hero h1 em { font-style: normal; color: var(--yellow); }
.hero-sub { margin: 12px 0 0; color: #C9D5F5; font-size: 13.5px; max-width: 26em; }
.hero-cards { position: relative; min-height: 170px; }
.tcard {
  position: absolute;
  background: #fff;
  border-radius: 14px;
  padding: 6px 6px 0;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .28);
  display: flex; flex-direction: column; align-items: center;
}
.tcard img { display: block; width: 100%; height: auto; border-radius: 9px; }
.tcard span {
  font: 400 13px/1 var(--display);
  color: #fff;
  padding: 6px 10px 7px;
  margin: 5px -6px 0;
  align-self: stretch;
  text-align: center;
  border-radius: 0 0 14px 14px;
}
.tcard.penta { width: 70%; right: 0; top: 0; transform: rotate(4deg); flex-direction: column-reverse; padding: 0 6px 6px; }
.tcard.penta span { background: #1C3A8C; margin: 0 -6px 5px; border-radius: 14px 14px 0 0; }
.tcard.ace { width: 52%; left: 0; bottom: -18px; transform: rotate(-6deg); }
.tcard.ace span { background: #D7262F; }
.hero-cards.art { min-height: 0; display: flex; align-items: center; justify-content: center; }
.hero-art { display: block; width: 100%; height: auto; max-height: 250px; overflow: visible; }
@media (min-width: 560px) {
  .hero { padding: 30px 26px 64px 30px; }
  .hero-cards { min-height: 230px; }
}

/* ---------- search ---------- */
.search {
  position: relative;
  margin: -34px 10px 0;
  z-index: 2;
  display: flex; align-items: center;
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: 16px;
  box-shadow: var(--shadow), 0 4px 0 var(--ink);
}
.search svg { flex: none; margin-left: 14px; color: var(--ink-3); }
.search input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: transparent;
  font: 500 18px/1.2 var(--body);
  color: var(--ink);
  padding: 16px 10px 16px 10px;
}
.search input::placeholder { color: var(--ink-3); font-weight: 400; }
.search input::-webkit-search-cancel-button { display: none; }
.search:focus-within { border-color: var(--navy); box-shadow: var(--shadow), 0 4px 0 var(--navy); }
.clear {
  flex: none;
  width: 40px; height: 40px; margin-right: 6px;
  border: 0; border-radius: 12px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 22px; line-height: 1;
  cursor: pointer;
}
.hint { margin: 14px 12px 0; color: var(--ink-3); font-size: 13px; }
.hint b { color: var(--ink-2); font-weight: 500; }
.onair { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 10px 0; }
.onair button {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 4px 11px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink-2);
  font-size: 12.5px; cursor: pointer;
}
.onair button:hover { border-color: var(--navy); color: var(--ink); }
.onair b { font-weight: 700; color: var(--red); }
.onair b.soon { color: var(--link); }

/* ---------- chips ---------- */
.shelf { margin: 22px 0 0; }
.shelf-title {
  display: flex; align-items: baseline; gap: 8px;
  margin: 0 2px 10px;
  font: 700 13px/1.3 var(--body);
  color: var(--ink-2);
  letter-spacing: .02em;
}
.shelf-title small { font-weight: 400; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14.5px; font-weight: 500;
  cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.chip:hover { border-color: var(--navy); }
.chip:active { transform: scale(.97); }
.chip small { font-size: 11.5px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip.hot { border-color: transparent; background: var(--red); color: #fff; }
.chip.hot small { color: #FFD6D8; }
.chip.navy { border-color: transparent; background: var(--navy); color: #fff; }
.chip.navy small { color: #C9D5F5; }
.chip.ghost { min-height: 32px; padding: 4px 10px; font-size: 13.5px; background: var(--surface-2); }

/* ---------- results ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  margin: 26px 2px 12px;
}
.bar p { margin: 0; color: var(--ink-2); font-size: 14px; }
.bar p b { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.list { display: grid; gap: 14px; }

.bot {
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 18px 16px 12px;
  scroll-margin-top: 12px;
}
.bot-head { display: flex; align-items: center; gap: 12px; }
.bot-thumb {
  flex: none; width: 54px; height: 54px;
  border-radius: 12px; background: #fff; object-fit: contain;
  border: 1px solid var(--line);
}
.bot-title { flex: 1; min-width: 0; }
.bot-name { margin: 0; font: 400 26px/1.15 var(--display); letter-spacing: -.005em; }
.bot-name mark { background: linear-gradient(transparent 58%, var(--yellow) 58%); color: inherit; padding: 0 1px; }
.bot-meta { margin: 3px 0 0; color: var(--ink-3); font-size: 13px; }
.bot-count {
  flex: none; text-align: center;
  font: 400 26px/1 var(--sign);
  color: var(--red);
  font-variant-numeric: tabular-nums;
}
.bot-count span { display: block; margin-top: 3px; font: 500 11px/1 var(--body); color: var(--ink-3); }
.alias { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); }
.alias mark { background: var(--yellow-soft); color: var(--ink); border-radius: 3px; padding: 0 2px; }
.rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 0; font-size: 13px; color: var(--ink-3); }

.debut {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center;
  margin: 14px 0 6px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--yellow-soft);
}
.debut-label { grid-column: 1 / -1; font: 700 12px/1 var(--body); color: var(--yellow-ink); letter-spacing: .06em; }
.debut-title { font-weight: 700; font-size: 15.5px; }
.debut-title small { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-2); }

/* license plate: blue country band + episode number */
.plate {
  flex: none;
  display: inline-flex; align-items: stretch;
  height: 30px;
  border: 2px solid var(--plate-edge);
  border-radius: 6px;
  background: var(--plate);
  color: var(--plate-ink);
  overflow: hidden;
  font: 400 16px/1 var(--sign);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .12);
}
.plate i {
  display: grid; place-items: center;
  min-width: 26px; padding: 0 4px;
  background: #1C3A8C; color: #fff;
  font: 400 11px/1 var(--sign); font-style: normal; letter-spacing: .02em;
}
.plate b { display: grid; place-items: center; min-width: 40px; padding: 0 7px; font-weight: 400; }

.grp { border-top: 1px solid var(--line); }
.grp > summary {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 2px;
  cursor: pointer;
  list-style: none;
}
.grp > summary::-webkit-details-marker, .ep > summary::-webkit-details-marker { display: none; }
.grp > summary::before {
  content: ""; flex: none;
  width: 8px; height: 8px;
  border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
  transform: rotate(-45deg); margin: 0 4px 0 2px;
  transition: transform .15s;
}
.grp[open] > summary::before { transform: rotate(45deg); }
.grp-name { font-weight: 700; }
.grp-year { color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.grp-n {
  margin-left: auto;
  font: 400 15px/1 var(--sign); color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.grp.parent > summary .grp-name { color: var(--link); }
.ep-list { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 2px; }
.ep > summary {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
  min-height: 46px;
  padding: 7px 8px;
  border-radius: 12px;
  cursor: pointer;
  list-style: none;
}
.ep > summary:hover { background: var(--surface-2); }
.ep[open] > summary { background: var(--navy-soft); }
.ep-title { flex: 1 1 10em; min-width: 0; font-weight: 500; }
.ep-cast-summary { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 400; line-height: 1.65; color: var(--ink-2); overflow-wrap: anywhere; }
.ep-series { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); }
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11.5px; font-weight: 500; line-height: 1.5;
  border: 1px solid var(--line);
  color: var(--ink-2);
  background: var(--surface);
}
.tag.star { border-color: transparent; background: var(--yellow); color: #3D2C00; font-weight: 700; }
.tag.minor { border-style: dashed; color: var(--ink-3); }
.ep-more { margin: 4px 8px 12px 8px; padding: 10px 12px 12px; border-left: 3px solid var(--navy); }
.ep-note { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.ep-cast-label { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; }
.copy {
  margin-top: 12px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 7px 12px;
  font-size: 13px; cursor: pointer; color: var(--ink-2);
}
.copy:hover { border-color: var(--navy); color: var(--ink); }
.empty-note { margin: 12px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
.more {
  width: 100%;
  margin-top: 4px;
  padding: 12px; border-radius: 14px;
  border: 1px dashed var(--line); background: transparent;
  color: var(--ink-2); cursor: pointer;
}

.titles { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 10px 8px; }
.titles h2 { margin: 6px 8px 6px; font-size: 14px; color: var(--ink-2); }
.none { text-align: center; padding: 30px 16px; color: var(--ink-2); }
.none strong { display: block; font: 400 22px/1.3 var(--display); color: var(--ink); margin-bottom: 6px; }

/* ---------- 도감 (browse) ---------- */
.dex { margin-top: 30px; }
.dex h2 { margin: 0 2px 4px; font: 400 24px/1.2 var(--display); }
.dex > p { margin: 0 2px 16px; color: var(--ink-3); font-size: 13.5px; }
.dex-grp { padding: 14px 0; border-top: 1px solid var(--line); }
.dex-grp h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 10px; font-size: 14.5px; }
.dex-grp h3 span { font-weight: 400; color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }

footer { margin: 34px 4px 0; color: var(--ink-3); font-size: 12px; line-height: 1.7; }
footer p { margin: 0 0 6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 12px;
  font-size: 14px; box-shadow: var(--shadow);
  z-index: 10;
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<div class="wrap">

    <div>
      <p class="eyebrow">헬로카봇 출연편 찾기</p>
      <h1>이 카봇,<br><em>몇 화</em>에 나와?</h1>
      <p class="hero-sub">로봇 이름을 치면 나오는 시즌과 회차를 바로 알려줘요.</p>
    </div>
    <div class="hero-cards art" aria-hidden="true"><svg class="hero-art" viewBox="0 0 230 250" role="img" aria-label="자동차 로봇 두 대" xmlns="http://www.w3.org/2000/svg">

    <text x="66" y="139" text-anchor="middle" font-family="'Do Hyeon','Malgun Gothic',sans-serif" font-size="15" fill="#101521">05</text>
    <rect x="28" y="178" width="26" height="32" rx="6" fill="#23408F"/>
    <rect x="66" y="178" width="26" height="32" rx="6" fill="#23408F"/>
    <rect x="22" y="206" width="36" height="12" rx="5" fill="#FFC619"/>
    <rect x="62" y="206" width="36" height="12" rx="5" fill="#FFC619"/>
  </g>

  <!-- red robot (front) -->

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'ko';

  [['에이스', '.tcard.ace img'], ['펜타스톰', '.tcard.penta img']].forEach(([n, sel]) => { const im = document.querySelector(sel); if (im) IMG[n] = im.src; });

  // ---------- indexes ----------
  const byName = new Map(R.map((r, i) => [r.n, i]));
  const appear = R.map(() => []);            // robot -> [[episodeIdx, castEntry]] in broadcast order
  E.forEach((e, ei) => e[5].forEach(c => { if (c[0] >= 0) appear[c[0]].push([ei, c]); }));
  const count = appear.map(a => a.length);
  const seriesById = new Map(S.map((s, i) => [s.id, i]));
  const firstSeries = R.map((r, i) => {
    if (appear[i].length) return E[appear[i][0][0]][0];
    const si = seriesById.get('s' + r.s);
    return si === undefined ? S.reduce((last, s, k) => (s.aired ? k : last), 0) : si;
  });

  // ---------- text helpers ----------
  const escH = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function seriesTitle(s) {
    if (s.kind === '본편') return s.name + (s.sub ? ' · ' + s.sub : '');

  }
  function band(s) {
    return s.kind === '본편' ? seasonNo(s) + '기' : s.kind === '스페셜' ? 'SP' : s.kind === '외전' ? '외전' : '영화';
  }
  function hasBatchim(word) {
    const c = word.charCodeAt(word.length - 1);

  }
  const withRo = w => w + ((() => { const c = w.charCodeAt(w.length - 1); const j = (c >= 0xAC00 && c <= 0xD7A3) ? (c - 0xAC00) % 28 : 0; return j && j !== 8 ? '으로' : '로'; })());
  const withI = w => w + (hasBatchim(w) ? '이' : '가');
  const withEun = w => w + (hasBatchim(w) ? '은' : '는');

  // ---------- 초성 / partial-syllable search ----------
  const CHO = [...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'];

  const JONG_SPLIT = { 'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ', 'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ', 'ㄼ': 'ㄹㅂ', 'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ', 'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ' };
  const SEP = '[\\s·ㆍ:.\\-!/,~&()]*';
  const STRIP = /[\s·ㆍ:.\-!/,~&()]+/g;
  const chr = c => String.fromCharCode(c);
  const escR = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const choClass = ci => { const s = 0xAC00 + ci * 588; return '[' + chr(s) + '-' + chr(s + 587) + CHO[ci] + ']'; };

    const parts = chars.map((ch, i) => {
      const c = ch.charCodeAt(0);
      if (c >= 0xAC00 && c <= 0xD7A3) {
        hasSyl = true;
        if (i < chars.length - 1) return escR(ch);
        // last syllable may still be mid-typing: 페 → 펜, 탓 → 타+ㅅ…
        const jong = (c - 0xAC00) % 28;
        if (!jong) return '[' + chr(c) + '-' + chr(c + 27) + ']';
        const split = JONG_SPLIT[JONG[jong]];
        const keep = split ? JONG.indexOf(split[0]) : 0;
        const next = CHO.indexOf(split ? split[1] : JONG[jong]);
        return '(?:' + escR(ch) + '|' + chr(c - jong + keep) + SEP + (next >= 0 ? choClass(next) : '') + ')';
      }
      const ci = CHO.indexOf(ch);
      return ci >= 0 ? choClass(ci) : escR(ch);
    });
    return { re: new RegExp(parts.join(SEP), 'i'), hasSyl, len: chars.length };
  }

  function scoreRobot(i, q) {
    const r = R[i];
    const names = [r.n].concat(r.a || []);
    let best = null;
    names.forEach((s, k) => {
      const m = q.re.exec(s);
      if (!m) return;
      let sc = k === 0 ? 50 : 36;
      if (m.index === 0) sc += 24;
      if (m[0].length === s.length) sc += 30;
      sc -= Math.min(12, (s.length - m[0].length) * 0.7);
      if (!best || sc > best.sc) best = { sc, k, s, idx: m.index, len: m[0].length };
    });
    if (!best) return null;
    best.sc += Math.min(12, Math.log2(1 + count[i]) * 2);
    return best;
  }

  function search(raw) {
    const q = compile(raw);
    if (!q) return null;
    const flat = raw.replace(STRIP, '');
    const q2 = /^(카봇|ㅋㅂ)./.test(flat) ? compile(flat.replace(/^(카봇|ㅋㅂ)/, '')) : null;
    const hits = [];
    R.forEach((r, i) => {
      let h = scoreRobot(i, q);
      const h2 = q2 && scoreRobot(i, q2);
      if (h2 && (!h || h2.sc - 4 > h.sc)) h = Object.assign(h2, { sc: h2.sc - 4 });
      if (h) hits.push(Object.assign(h, { i }));
    });
    hits.sort((a, b) => b.sc - a.sc || count[b.i] - count[a.i]);
    let titles = [];
    if (q.hasSyl && q.len >= 2) {
      E.forEach((e, ei) => { const m = q.re.exec(e[2]); if (m) titles.push({ ei, idx: m.index, len: m[0].length }); });
    }
    const series = q.len >= 2 ? S.map((s, si) => si).filter(si => [seriesTitle(S[si]), S[si].sub].some(n => n && q.re.test(n))) : [];
    return { hits, titles, series };
  }

  // ---------- rendering ----------
  let order = 'old';
  try { order = localStorage.getItem('carbot-order') === 'new' ? 'new' : 'old'; } catch (e) {}
  let shown = 8;

  function mark(s, idx, len) {
    if (idx == null) return escH(s);
    return escH(s.slice(0, idx)) + '<mark>' + escH(s.slice(idx, idx + len)) + '</mark>' + escH(s.slice(idx + len));
  }
  function tagsHtml(tags, isDebut) {
    let h = isDebut ? '<span class="tag star">★ 첫 등장</span>' : '';
    (tags || []).forEach(t => {
      h += '<span class="tag' + (MINOR.has(t) ? ' minor' : '') + '">' + escH(TAG_LABEL[t] || t) + '</span>';
    });
    return h ? '<span class="tags">' + h + '</span>' : '';
  }
  function plate(s, label) {
    const num = label.replace(/화$/, '');
    return '<span class="plate" aria-label="' + escH(seriesTitle(s) + ' ' + label) + '"><i>' + escH(band(s)) + '</i><b>' + escH(/^\d+$/.test(num) ? num + '화' : label) + '</b></span>';
  }
  function copyText(e) {
    const s = S[e[0]];
    return s.kind === '극장판' ? e[2] : '헬로카봇 ' + seriesTitle(s).replace(' · ', ' ') + ' ' + e[1] + ' ' + e[2];
  }
  function epRow(ei, c, debut, showSeries) {
    const e = E[ei], s = S[e[0]];
    const castSummary = e[5].map(x => {
      const name = x[0] >= 0 ? R[x[0]].n : x[1];
      const tags = (x[2] || []).map(t => TAG_LABEL[t] || t);
      return escH(name + (tags.length ? ' (' + tags.join(', ') + ')' : ''));
    }).join(' · ');
    const cast = e[5].map(x => x[0] >= 0
      ? '<button class="chip ghost" type="button" data-bot="' + x[0] + '">' + escH(R[x[0]].n) + '</button>'
      : '<span class="chip ghost" style="cursor:default">' + escH(x[1]) + '</span>').join('');
    return '<li><details class="ep"><summary>' + plate(s, e[1]) +
      '<span class="ep-title">' + escH(e[2]) + (showSeries ? '<span class="ep-series">' + escH(seriesTitle(s)) + (s.year ? ' · ' + s.year : '') + '</span>' : '') + '<span class="ep-cast-summary">출연 카봇: ' + (castSummary || '기록 없음') + '</span></span>' +
      tagsHtml(c && c[2], debut) + '</summary><div class="ep-more">' +
      (e[4] ? '<p class="ep-note">' + escH(e[4]) + '</p>' : '') +
      (e[3] ? '<p class="ep-note">방영일 ' + escH(e[3].replace(/-/g, '.')) + '</p>' : '') +
      '<p class="ep-cast-label">이 편에 나오는 카봇</p><div class="chips">' + (cast || '<span class="ep-note">기록 없음</span>') + '</div>' +
      '<button class="copy" type="button" data-copy="' + escH(copyText(e)) + '">제목 복사</button>' +
      '</div></details></li>';
  }
  function groupsHtml(list, debutEi, openAll, cls) {
    const groups = new Map();
    list.forEach(([ei, c]) => {
      const si = E[ei][0];
      if (!groups.has(si)) groups.set(si, []);
      groups.get(si).push([ei, c]);
    });
    let keys = [...groups.keys()];
    if (order === 'new') keys.reverse();
    return keys.map(si => {
      const s = S[si], rows = groups.get(si);
      const items = (order === 'new' ? rows.slice().reverse() : rows).map(([ei, c]) => epRow(ei, c, ei === debutEi, false)).join('');
      return '<details class="grp' + (cls ? ' ' + cls : '') + '"' + (openAll ? ' open' : '') + '><summary><span class="grp-name">' + escH(seriesTitle(s)) +
        '</span><span class="grp-year">' + (s.year || '') + '</span><span class="grp-n">' + rows.length + '편</span></summary><ol class="ep-list">' + items + '</ol></details>';
    }).join('');
  }
  function debutOf(i) {
    const a = appear[i];
    if (!a.length) return null;
    return a.find(([, c]) => !(c[2] || []).some(t => MINOR.has(t))) || a[0];
  }
  function robotCard(h) {
    const i = h.i, r = R[i], a = appear[i];
    const d = debutOf(i);
    const meta = [];
    const fs = S[firstSeries[i]];
    if (r.s) meta.push('시즌 ' + r.s + ' 카봇');
    else if (fs) meta.push(fs.kind === '본편' ? fs.name + ' 카봇' : seriesTitle(fs) + ' 카봇');
    if (r.k) meta.push(r.k);
    if (r.c) meta.push(r.c);
    if (r.m && r.m.length) meta.push(r.m.length + '대 합체·팀');
    const nameHtml = h.k === 0 ? mark(r.n, h.idx, h.len) : escH(r.n);
    let aliasHtml = '';
    if (r.a && r.a.length) {
      aliasHtml = '<p class="alias">다른 이름 · ' + r.a.map((s, k) => h.k === k + 1 ? mark(s, h.idx, h.len) : escH(s)).join(' · ') + '</p>';
    }
    let rel = '';
    if (r.p && r.p.length) rel += '<span>합체하면</span>' + r.p.map(p => byName.has(p) ? '<button class="chip ghost" type="button" data-bot="' + byName.get(p) + '">' + escH(p) + ' →</button>' : '').join('');
    if (r.m && r.m.length) rel += '<span>멤버</span>' + r.m.map(m => byName.has(m) ? '<button class="chip ghost" type="button" data-bot="' + byName.get(m) + '">' + escH(m) + '</button>' : '').join('');
    if (r.r && r.r.length) rel += '<span>관련</span>' + r.r.map(m => byName.has(m) ? '<button class="chip ghost" type="button" data-bot="' + byName.get(m) + '">' + escH(m) + '</button>' : '').join('');
    const debutHtml = d ? '<div class="debut"><span class="debut-label">★ 처음 나온 편</span>' + plate(S[E[d[0]][0]], E[d[0]][1]) +
      '<span class="debut-title">' + escH(E[d[0]][2]) + '<small>' + escH(seriesTitle(S[E[d[0]][0]])) + (S[E[d[0]][0]].year ? ' · ' + S[E[d[0]][0]].year : '') + '</small></span></div>' : '';
    let body = '';
    if (a.length) {
      body += '<div class="eps">' + groupsHtml(a, d && d[0], a.length <= 8, '') + '</div>';
    }
    const viaParents = (r.p || []).filter(p => byName.has(p) && appear[byName.get(p)].length);
    viaParents.forEach(p => {
      const pa = appear[byName.get(p)].filter(([ei]) => !a.some(([x]) => x === ei));
      if (!pa.length) return;
      body += '<p class="rel" style="margin-top:14px"><b style="color:var(--ink-2)">' + escH(withRo(p)) + ' 나온 편</b> <span>(' + escH(withI(r.n)) + ' 함께 나와요)</span></p>' +
        groupsHtml(pa, null, a.length < 3 && pa.length <= 12, 'parent');
    });
    if (!a.length && !viaParents.length) {
      const rs = S[seriesById.get('s' + r.s)];
      const later = rs && (rs.planned || rs.upcoming) ? ' ' + withI(rs.name) + (rs.upcoming ? ' 아직 방영 전이라' : ' 방영 중이라') + ' 곧 나올 수 있어요.' : '';
      body += '<p class="empty-note">아직 회차표에 출연 기록이 없어요.' + later + '</p>';
    } else if (!a.length) {
      body = '<p class="empty-note">' + escH(withI(r.n)) + ' 따로 적힌 편은 없고, 합체·팀으로 나온 편이 있어요.</p>' + body;
    }
    const thumb = IMG[r.n] ? '<img class="bot-thumb" src="' + IMG[r.n] + '" alt="">' : '';
    return '<article class="bot" id="bot-' + i + '"><header class="bot-head">' + thumb + '<div class="bot-title"><h2 class="bot-name">' + nameHtml + '</h2>' +
      '<p class="bot-meta">' + escH(meta.join(' · ')) + '</p></div><div class="bot-count" aria-label="출연 ' + a.length + '편">' + a.length + '<span>편 출연</span></div></header>' +
      aliasHtml + (rel ? '<div class="rel">' + rel + '</div>' : '') + debutHtml + body + '</article>';
  }

  const UPCOMING_NOTE = '<p class="empty-note">아직 방영 전이라 회차·카봇 정보가 없어요. 첫 방송 뒤 회차표가 올라오면 업데이트로 채워져요.</p>';
  function seriesCard(si) {
    const s = S[si];
    const eps = [];
    E.forEach((e, ei) => { if (e[0] === si) eps.push(ei); });
    const meta = s.upcoming ? '방영 예정' : [s.year, s.planned ? s.aired + '화까지 방영 · 전체 ' + s.planned + '화' : eps.length + '편'].filter(Boolean).join(' · ');
    const body = s.upcoming ? UPCOMING_NOTE :
      '<details class="grp"' + (eps.length <= 8 ? ' open' : '') + '><summary><span class="grp-name">회차 목록</span><span class="grp-n">' + eps.length + '편</span></summary>' +
      '<ol class="ep-list">' + eps.map(ei => epRow(ei, null, false, false)).join('') + '</ol></details>';
    return '<article class="bot"><header class="bot-head"><div class="bot-title"><h2 class="bot-name">' + escH(seriesTitle(s)) + '</h2>' +
      '<p class="bot-meta">' + escH(meta) + '</p></div></header>' + body + '</article>';
  }
  function seriesBlock(list) {
    return '<div class="bar"><p>시리즈 <b>' + list.length + '개</b></p></div><div class="list">' + list.map(seriesCard).join('') + '</div>';
  }

  const $ = id => document.getElementById(id);
  const input = $('q'), results = $('results');

  function renderDex() {
    const groups = new Map();
    R.forEach((r, i) => {
      const si = firstSeries[i];
      if (!groups.has(si)) groups.set(si, []);
      groups.get(si).push(i);
    });
    S.forEach((s, si) => { if (s.upcoming && !groups.has(si)) groups.set(si, []); });
    const keys = [...groups.keys()].sort((a, b) => a - b);
    return '<section class="dex"><h2>카봇 도감</h2><p>' + R.length + '개 로봇을 처음 나온 시리즈별로 모았어요. 이름을 누르면 나온 편이 보여요.</p>' +
      keys.map(si => {
        const s = S[si];
        const chips = groups.get(si).sort((a, b) => count[b] - count[a]).map(i =>
          '<button class="chip" type="button" data-bot="' + i + '">' + escH(R[i].n) + (count[i] ? '<small>' + count[i] + '</small>' : '') + '</button>').join('');
        return '<div class="dex-grp"><h3>' + escH(seriesTitle(s)) + '<span>' + (s.year || (s.upcoming ? '방영 예정' : '')) + '</span></h3>' +
          (chips ? '<div class="chips">' + chips + '</div>' : '') + (s.upcoming ? UPCOMING_NOTE : '') + '</div>';
      }).join('') + '</section>';
  }

  function render() {
    const raw = input.value.trim();
    $('clear').hidden = !raw;
    if (!raw) { results.innerHTML = renderDex(); return; }
    const res = search(raw);
    if (!res || (!res.hits.length && !res.titles.length && !res.series.length)) {
      results.innerHTML = '<div class="none"><strong>‘' + escH(raw) + '’ 카봇을 못 찾았어요</strong>이름 앞부분만 치거나 초성으로 찾아보세요. 예: ㅁㅇㅌㄱㄷ → 마이티가드</div>';
      return;
    }
    const { hits, titles, series } = res;
    let h = '';
    if (series.length && !hits.length) h += seriesBlock(series);
    if (hits.length) {
      h += '<div class="bar"><p><b>' + hits.length + '개</b> 카봇을 찾았어요</p><div class="seg" role="group" aria-label="정렬">' +
        '<button type="button" data-order="old" aria-pressed="' + (order === 'old') + '">방영순</button>' +
        '<button type="button" data-order="new" aria-pressed="' + (order === 'new') + '">최신 시즌부터</button></div></div>';
      h += '<div class="list">' + hits.slice(0, shown).map(robotCard).join('') + '</div>';
      if (hits.length > shown) h += '<button class="more" type="button" data-more="1">' + (hits.length - shown) + '개 더 보기</button>';
      if (series.length) h += seriesBlock(series);
    }
    if (titles.length) {
      h += '<div class="bar"><p>제목에 ‘' + escH(raw) + '’' + (hasBatchim(raw) ? '이' : '가') + ' 들어간 편 <b>' + titles.length + '개</b></p></div>' +
        '<div class="titles"><ol class="ep-list">' + titles.slice(0, 30).map(t => epRow(t.ei, null, false, true)).join('') + '</ol></div>';
    }
    results.innerHTML = h;
    remember(hits);
  }

  // ---------- recent + popular ----------
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem('carbot-recent') || '[]').filter(n => byName.has(n)); } catch (e) {}
  let rememberTimer = 0;
  function remember(hits) {
    clearTimeout(rememberTimer);
    if (!hits.length) return;
    rememberTimer = setTimeout(() => {
      const top = hits[0];
      if (top.sc < 80 && hits.length > 1) return;   // only confident hits
      pushRecent(R[top.i].n);
    }, 1500);
  }
  function pushRecent(name) {
    recent = [name].concat(recent.filter(n => n !== name)).slice(0, 8);
    try { localStorage.setItem('carbot-recent', JSON.stringify(recent)); } catch (e) {}
    drawRecent();
  }
  function drawRecent() {
    $('recent-shelf').hidden = !recent.length;
    $('recent').innerHTML = recent.map(n => '<button class="chip" type="button" data-bot="' + byName.get(n) + '">' + escH(n) + '<small>' + count[byName.get(n)] + '</small></button>').join('');
  }
  function drawPopular() {
    const pinned = ['에이스', '펜타스톰'].map(n => byName.get(n));
    const top = R.map((r, i) => i).filter(i => !pinned.includes(i)).sort((a, b) => count[b] - count[a]).slice(0, 12);
    $('popular').innerHTML = pinned.concat(top).map((i, k) =>
      '<button class="chip' + (k === 0 ? ' hot' : k === 1 ? ' navy' : '') + '" type="button" data-bot="' + i + '">' + escH(R[i].n) + '<small>' + count[i] + '</small></button>').join('');
  }

  // ---------- events ----------
  let typing = 0;
  input.addEventListener('input', () => { shown = 8; clearTimeout(typing); typing = setTimeout(render, 60); });
  input.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
  $('clear').addEventListener('click', () => { input.value = ''; render(); input.focus(); });

  function pick(i) {
    input.value = R[i].n;
    shown = 8;
    render();
    pushRecent(R[i].n);
    const card = document.getElementById('bot-' + i);
    if (card) {
      const g = card.querySelector('.grp');
      if (g && !card.querySelector('.grp[open]')) g.open = true;
      card.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
  }
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  document.addEventListener('click', ev => {
    const bot = ev.target.closest('[data-bot]');
    if (bot) { ev.preventDefault(); pick(+bot.dataset.bot); return; }
    const sq = ev.target.closest('[data-q]');
    if (sq) {
      input.value = sq.dataset.q; shown = 8; render();
      results.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      return;
    }
    const cp = ev.target.closest('[data-copy]');
    if (cp) {
      const text = cp.dataset.copy;
      const done = () => toast('복사했어요: ' + text);
      const fail = () => toast(text);
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
      return;
    }
    const ord = ev.target.closest('[data-order]');
    if (ord) {
      order = ord.dataset.order;
      try { localStorage.setItem('carbot-order', order); } catch (e) {}
      const openIds = [...document.querySelectorAll('.bot')].filter(b => b.querySelector('.grp[open]')).map(b => b.id);
      render();
      openIds.forEach(id => { const g = document.querySelector('#' + id + ' .grp'); if (g) g.open = true; });
      return;
    }
    if (ev.target.closest('[data-more]')) { shown += 12; render(); }
  });

  // on-air / upcoming status comes from the data, so a new season shows up after the next update
  const mains = S.filter(s => s.kind === '본편');
  const lastNo = Math.max(...mains.filter(s => s.aired).map(s => +seasonNo(s)));
  const onAir = mains.filter(s => s.planned), soon = mains.filter(s => s.upcoming);
  $('about').textContent = '시즌 1~' + lastNo + ' 본편·스페셜·외전·극장판 ' + E.length + '편, 로봇 ' + R.length + '개가 들어 있어요 (' + DATA.updated.replace(/-/g, '.') + ' 기준).' +
    onAir.map(s => ' ' + withEun(s.name) + ' ' + s.aired + '화까지 방영됐어요(전체 ' + s.planned + '화).').join('') +
    soon.map(s => ' ' + withEun(seriesTitle(s)) + ' 아직 방영 전이에요.').join('');
  $('onair').innerHTML = onAir.map(s => '<button type="button" data-q="' + escH(s.sub || s.name) + '"><b>방영 중</b>' + escH(seriesTitle(s)) + ' · ' + s.aired + '/' + s.planned + '화</button>').join('') +
    soon.map(s => '<button type="button" data-q="' + escH(s.sub || s.name) + '"><b class="soon">방영 예정</b>' + escH(seriesTitle(s)) + '</button>').join('');
  $('onair').hidden = !(onAir.length || soon.length);
  drawPopular();
  drawRecent();
  render();
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));</script>
</html>
